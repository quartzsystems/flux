[workspace]
resolver = "2"
members = ["crates/flux-core", "crates/fluxd", "crates/flux-portd"]

[workspace.package]
# Deliberately a placeholder. The appliance's version lives in the VERSION file
# at the repository root, which crates/flux-core/build.rs reads at compile time —
# `flux_core::VERSION` and `fluxd --version` both come from there. Cargo cannot
# read a file into a manifest, so the choice was between duplicating the version
# here and keeping the two in step, or not duplicating it at all. The first was
# tried; the copy drifted and blocked releases. Nothing publishes these crates,
# so the number here is inert. Leave it at 0.0.0.
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Quartz Systems"]
repository = "https://github.com/quartzsystems/flux"

[workspace.dependencies]
flux-core = { path = "crates/flux-core" }

anyhow = "1"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = [
  "serde",
  "serde-well-known", # RFC 3339 on the wire; the appliance may be read by other tools
  "formatting",
  "parsing",
  "macros",
] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
