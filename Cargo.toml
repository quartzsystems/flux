[workspace]
resolver = "2"
members = ["crates/flux-core", "crates/fluxd", "crates/flux-portd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Quartz Systems"]
repository = "https://github.com/quartzsystems/flux"

[workspace.dependencies]
flux-core = { path = "crates/flux-core" }

anyhow = "1"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = [
  "serde",
  "serde-well-known", # RFC 3339 on the wire; the appliance may be read by other tools
  "formatting",
  "parsing",
  "macros",
] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
