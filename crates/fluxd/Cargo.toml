[package]
name = "fluxd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The Flux appliance daemon: REST + WebSocket API, orchestrator, engine supervisor"

[dependencies]
flux-core.workspace = true

anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
  "fs",
  "trace",
  "compression-gzip",
  "set-header",
  "catch-panic",
] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "time",
  "json",
  "migrate",
  "macros",
] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
utoipa = { version = "5", features = ["axum_extras", "uuid", "time"] }
sysinfo = "0.33"
mime_guess = "2"
base64 = "0.22"
serde_yaml = "0.9"
futures-util = "0.3"
tokio-util = "0.7"

# VictoriaMetrics runs on loopback and speaks plain HTTP, so no TLS backend is
# linked. That keeps the appliance image free of a second TLS stack.
reqwest = { version = "0.12", default-features = false }

# ZeroMQ transport to TRex.
#
# This is `zeromq` (a pure-Rust implementation) rather than the `zmq` bindings.
# `zmq` links libzmq, which on a machine without it must be built from source by
# cmake — making `cargo build` fail anywhere the C toolchain is absent, including
# CI and any developer box that only wants to work on the API. The protocol on
# the wire is identical, and the choice is isolated behind `engine::trex::transport`.
zeromq = { version = "0.6", default-features = false, features = [
  "tokio-runtime",
  "tcp-transport",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_urlencoded = "0.7"
